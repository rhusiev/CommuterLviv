# The build recipe for F-Droid.
#
# This file does not live here in the end: it is copied to
# `metadata/nl.r1a.commuterlviv.yml` in a fork of the `fdroiddata` repository and
# sent as a merge request. It is kept here so the recipe and the app it builds
# change together.
#
# One rule keeps it working: each release needs an annotated tag named
# `v<version>` on the commit carrying that version, because `UpdateCheckMode:
# Tags` looks for one and the build below names it as its commit. The recipe
# also expects the three per-ABI APKs to be on the matching GitHub release
# under the `binary:` URLs below, because `Builds:` rebuilds from source and
# `apksigcopier` only accepts a release whose signed bytes match. `deploy/
# release-apk.sh` builds them and prints the `gh release create` command.
#
# The licence is MIT and the file is `LICENSE` at the root, where F-Droid looks. There is no proprietary dependency to strip: the
# app pulls no Google Play services, no Firebase and no map vendor SDK, which is
# why it is a Flutter app talking to `dart:io` sockets rather than an Expo one,
# and why `MainActivity.kt` writes its own location channel over AOSP's
# `LocationManager`. `android/app/build.gradle.kts` already signs a release only
# if `key.properties` is there, so F-Droid's keyless build produces the unsigned
# APK it then signs itself, and it drops the Google-signed dependency blob that
# F-Droid rejects.

