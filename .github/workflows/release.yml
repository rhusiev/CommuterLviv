# Tag the commit and publish a GitHub release, with the three per-ABI APKs if
# the app's version moved too.
#
# Runs on every push to `main`, which is protected and only takes merges from
# `dev`, so a release can never come from `dev`. A push whose version
# (`commuterlviv/__init__.py`) already has a `v<version>` tag releases nothing.
# When the pubspec carries the same version, the annotated tag is created only
# once the APKs have built and verified, because F-Droid builds from that tag
# the moment it sees it. When the pubspec is behind, the app is still the one
# released under that older tag, so `mobile/` must not have changed since it
# and that tag's release must still carry its three APKs, and the release is
# the tag alone. A tag pushed by hand while the APKs build is taken as it
# stands when it is this commit's, rather than failing the push and losing the
# release it was meant to publish.
#
# Reproducibility note: both this workflow and F-Droid's recipe physically
# `mv` their checkout to `/tmp/build/nl.r1a.commuterlviv` before building,
# so the absolute path Flutter's Gradle plugin bakes into `libapp.so` is
# the real directory location on both sides (not a resolved-through-
# symlink path like `/home/runner/work/...` here or `/home/vagrant/build/...`
# on F-Droid). Without that, the cross-build `diff -r` fails on the
# baked-in `dart_plugin_registrant.dart` path. `/tmp` is chosen because
# both this runner (rootless `runner` user) and F-Droid's build (which
# removes sudo before running the recipe) can write to `/tmp`, while
# `/srv` is root-owned and rejected by both.
#
# Secrets this workflow expects (set them at
# https://github.com/rhusiev/CommuterLviv/settings/secrets/actions):
#   ANDROID_KEYSTORE_B64       base64 of mobile/android/commuterlviv-release.jks
#   ANDROID_KEYSTORE_PASSWORD  storePassword from key.properties
#   ANDROID_KEY_ALIAS          keyAlias from key.properties
#   ANDROID_KEY_PASSWORD       keyPassword from key.properties
name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

# The pub cache path used to have to match F-Droid's, because it reached the
# debug info `libdartjni.so` carries out of its compile and the build-id
# hashed before the strip kept the difference even after the strip removed
# the info that carried it. `mobile/android/build.gradle.kts` now drops the
# build-id note outright, and F-Droid's recipe leaves its own pub cache at
# the default `%vagrant%/.pub-cache`, so this pin no longer decides anything
# and is only kept because moving it would change the reference APKs
env:
  PUB_CACHE: /tmp/pubcache

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      app: ${{ steps.check.outputs.app }}
      new: ${{ steps.check.outputs.new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' commuterlviv/__init__.py)
          app=$(sed -n 's/^version: \(.*\)+.*$/\1/p' mobile/pubspec.yaml)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null; then
            echo "v$ver is already released"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "new=true" >> "$GITHUB_OUTPUT"
          if [ "$app" != "$ver" ] && ! git diff --quiet "v$app" HEAD -- mobile \
              ':(exclude)mobile/fdroid' ':(exclude)mobile/README.md'; then
            echo "mobile/ changed since v$app, so the app needs a version of its own"
            exit 1
          fi
          # A server-only release rests on the app's own release already being
          # out: the F-Droid recipe names the app's tag and its three APKs. On
          # 2026-10-17 a v0.19.0 tag pushed by hand while the APKs built ate
          # that release, and v0.19.1 then shipped alone on the hole. A version
          # the app never published is a version to stop on, not step over
          if [ "$app" != "$ver" ]; then
            names=$(gh release view "v$app" --json assets --jq '.assets[].name' \
                    2>/dev/null) || names=""
            for abi in armeabi-v7a arm64-v8a x86_64; do
              echo "$names" | grep -qx "commuterlviv-$app-$abi.apk" || {
                echo "the app's v$app has no $abi APK - it was never released"
                exit 1
              }
            done
          fi

  # The app is unchanged since its own version's release: the tag and a release
  # with no APKs, which F-Droid passes over because the pubspec it reads at the
  # tag still carries the versionCode it has built
  server:
    needs: version
    if: needs.version.outputs.new == 'true' && needs.version.outputs.app != needs.version.outputs.version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The version job saw no tag, but the APKs take minutes to build and
          # one can be pushed by hand meanwhile - on 2026-10-17 exactly that
          # ate v0.19.0's release. Take a tag already at this commit as it
          # stands; refuse one that points anywhere else
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            git fetch --depth=1 origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
            [ "$(git rev-parse "refs/tags/v$VERSION^{commit}")" = "$(git rev-parse HEAD)" ] || {
              echo "v$VERSION already exists at another commit - refusing to release"
              exit 1
            }
            echo "v$VERSION already exists at this commit - leaving it as it is"
          else
            git tag -a "v$VERSION" -m "v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          body: The server and the web app only. The phone app stays at v${{ needs.version.outputs.app }}.
          generate_release_notes: true
          make_latest: false

  release:
    needs: version
    if: needs.version.outputs.new == 'true' && needs.version.outputs.app == needs.version.outputs.version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/apks
        with:
          version: ${{ env.VERSION }}
          keystore-b64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Tag the release
        working-directory: /tmp/build/nl.r1a.commuterlviv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The version job saw no tag, but the APKs took minutes to build and
          # one can be pushed by hand meanwhile - on 2026-10-17 exactly that
          # ate v0.19.0's release. Take a tag already at this commit as it
          # stands; refuse one that points anywhere else
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            git fetch --depth=1 origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
            [ "$(git rev-parse "refs/tags/v$VERSION^{commit}")" = "$(git rev-parse HEAD)" ] || {
              echo "v$VERSION already exists at another commit - refusing to release"
              exit 1
            }
            echo "v$VERSION already exists at this commit - leaving it as it is"
          else
            git tag -a "v$VERSION" -m "v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            /tmp/build/nl.r1a.commuterlviv/mobile/release/commuterlviv-*.apk
          generate_release_notes: true
