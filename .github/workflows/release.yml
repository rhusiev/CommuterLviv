# Build the three per-ABI release APKs and publish them as a GitHub release.
#
# Runs on a `v*` tag pushed to a branch in this repository, and only the
# version number comes off the tag - everything else (pubspec, lockfile,
# recipe, GHA) is whatever the tag's commit says it is, and that is the
# commit F-Droid builds from too.
#
# Reproducibility note: both this workflow and F-Droid's recipe physically
# `mv` their checkout to `/tmp/build/nl.r1a.commuterlviv` before building,
# so the absolute path Flutter's Gradle plugin bakes into `libapp.so` is
# the real directory location on both sides (not a resolved-through-
# symlink path like `/home/runner/work/...` here or `/home/vagrant/build/...`
# on F-Droid). Without that, the cross-build `diff -r` fails on the
# baked-in `dart_plugin_registrant.dart` path. `/tmp` is chosen because
# both this runner (rootless `runner` user) and F-Droid's build (which
# removes sudo before running the recipe) can write to `/tmp`, while
# `/srv` is root-owned and rejected by both.
#
# Secrets this workflow expects (set them at
# https://github.com/rhusiev/CommuterLviv/settings/secrets/actions):
#   ANDROID_KEYSTORE_B64       base64 of mobile/android/commuterlviv-release.jks
#   ANDROID_KEYSTORE_PASSWORD  storePassword from key.properties
#   ANDROID_KEY_ALIAS          keyAlias from key.properties
#   ANDROID_KEY_PASSWORD       keyPassword from key.properties
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
          android-sdk-version: 35
          ndk-version: r27c

      - name: Stage source at /tmp/build/nl.r1a.commuterlviv
        run: |
          # Move the checkout to /tmp/build/nl.r1a.commuterlviv (rather than
          # symlinking it) so the absolute path Flutter's Gradle plugin
          # bakes into libapp.so is the real directory location, not the
          # resolved-through-symlink path (/home/runner/work/... here and
          # /home/vagrant/build/... on F-Droid). The mv lets us match
          # F-Droid's `mv` staging exactly, which is the only way the
          # cross-build `diff -r` in apksigcopier can pass.
          mkdir -p /tmp/build
          mv "$GITHUB_WORKSPACE" /tmp/build/nl.r1a.commuterlviv

      - name: Decode keystore and write key.properties
        working-directory: /tmp/build/nl.r1a.commuterlviv/mobile/android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > commuterlviv-release.jks
          # Gradle's `file()` resolves `storeFile` relative to the app
          # module's project directory (mobile/android/app/), but the
          # keystore lives one level up at mobile/android/, so the path
          # has to step up: ../commuterlviv-release.jks
          cat > key.properties <<EOF
          storeFile=../commuterlviv-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build per-ABI APKs
        working-directory: /tmp/build/nl.r1a.commuterlviv/mobile
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release --split-per-abi

      - name: Verify signatures and rename for release
        working-directory: /tmp/build/nl.r1a.commuterlviv/mobile
        env:
          KEYSTORE_SHA256: 22e0d82c02f7a01805f121b40648bb4f6a2954b847e97089d3f73142ade31c32
        run: |
          ver=${GITHUB_REF_NAME#v}
          mkdir -p release
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | tail -1)
          for abi in armeabi-v7a arm64-v8a x86_64; do
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            dst="release/commuterlviv-${ver}-${abi}.apk"
            "$signer" verify --print-certs "$src" > verify.log
            grep -qi "$KEYSTORE_SHA256" verify.log || {
              echo "$src is not signed by the expected key; aborting"
              cat verify.log
              exit 1
            }
            cp "$src" "$dst"
          done
          ls -l release/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        # The mv above removed $GITHUB_WORKSPACE, and the action starts its
        # Node process from ${{ github.workspace }} unless told otherwise,
        # which failed with "No such file or directory" on v0.9.3
        working-directory: /tmp/build/nl.r1a.commuterlviv
        with:
          files: |
            /tmp/build/nl.r1a.commuterlviv/mobile/release/commuterlviv-*.apk
          generate_release_notes: true
