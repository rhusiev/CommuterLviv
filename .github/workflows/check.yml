# Runs ./check.sh, the checks made before a commit, on every pull request and
# every push to `dev`. `CI` is set on the runner, so a toolchain or a test that
# would be stepped over on a laptop fails here instead.
#
# The browser tests drive the Chromium or Chrome the runner image ships, and the
# database tests start their Postgres with its podman or docker. The versions are the ones the images and
# the release build use: Python as deploy/service.Dockerfile, Node as
# deploy/web.Dockerfile, Flutter as release.yml.
name: check

on:
  pull_request:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install the Python dependencies
        run: python -m pip install -r requirements-dev.txt ruff

      - name: Check
        run: ./check.sh
