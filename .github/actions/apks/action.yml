# Build the three per-ABI APKs the way F-Droid's recipe does, sign them with the
# release key and check the signatures, into
# /tmp/build/nl.r1a.commuterlviv/mobile/release/commuterlviv-<version>-<abi>.apk.
# Shared by release.yml and prerelease.yml, so a pre-release exercises exactly
# the build a release will run.
#
# It moves the checkout away from `github.workspace` and leaves an empty
# directory in its place, so every step after it must name its own
# `working-directory:` under /tmp/build/nl.r1a.commuterlviv.
name: apks
description: Build, sign and verify the per-ABI release APKs

inputs:
  version:
    description: The version in the APKs' file names
    required: true
  keystore-b64:
    description: base64 of mobile/android/commuterlviv-release.jks
    required: true
  keystore-password:
    description: storePassword from key.properties
    required: true
  key-alias:
    description: keyAlias from key.properties
    required: true
  key-password:
    description: keyPassword from key.properties
    required: true

runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.2
        channel: stable
        cache: true
        android-sdk-version: 35
        ndk-version: r27c

    - name: Stage source at /tmp/build/nl.r1a.commuterlviv
      shell: bash
      run: |
        # Move the checkout to /tmp/build/nl.r1a.commuterlviv (rather than
        # symlinking it) so the absolute path Flutter's Gradle plugin
        # bakes into libapp.so is the real directory location, not the
        # resolved-through-symlink path (/home/runner/work/... here and
        # /home/vagrant/build/... on F-Droid). The mv lets us match
        # F-Droid's `mv` staging exactly, which is the only way the
        # cross-build `diff -r` in apksigcopier can pass.
        mkdir -p /tmp/build
        mv "$GITHUB_WORKSPACE" /tmp/build/nl.r1a.commuterlviv

    - name: Decode keystore and write key.properties
      shell: bash
      working-directory: /tmp/build/nl.r1a.commuterlviv/mobile/android
      env:
        ANDROID_KEYSTORE_B64: ${{ inputs.keystore-b64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
        ANDROID_KEY_ALIAS: ${{ inputs.key-alias }}
        ANDROID_KEY_PASSWORD: ${{ inputs.key-password }}
      run: |
        echo "$ANDROID_KEYSTORE_B64" | base64 -d > commuterlviv-release.jks
        # Gradle's `file()` resolves `storeFile` relative to the app
        # module's project directory (mobile/android/app/), but the
        # keystore lives one level up at mobile/android/, so the path
        # has to step up: ../commuterlviv-release.jks
        cat > key.properties <<EOF
        storeFile=../commuterlviv-release.jks
        storePassword=$ANDROID_KEYSTORE_PASSWORD
        keyAlias=$ANDROID_KEY_ALIAS
        keyPassword=$ANDROID_KEY_PASSWORD
        EOF

    - name: Build per-ABI APKs
      shell: bash
      working-directory: /tmp/build/nl.r1a.commuterlviv/mobile
      env:
        VERSION: ${{ inputs.version }}
      run: |
        ver=$VERSION
        mkdir -p release
        flutter pub get --enforce-lockfile
        # One Gradle run per ABI, the way each of the recipe's three
        # `Builds:` blocks does it, rather than one --split-per-abi run
        # emitting all three. AGP packages the merged manifest of the
        # first split verbatim and re-serialises it for every later one,
        # and the re-serialisation inserts a blank line before a comment:
        # every line number in the packaged AndroidManifest.xml shifts by
        # one, which is a byte difference F-Droid's verification fails on.
        # A single-split run is always the first split, so building one at
        # a time is what makes all three match the recipe's rebuilds
        for abi in armeabi-v7a arm64-v8a x86_64; do
          case $abi in
            armeabi-v7a) target=android-arm ;;
            arm64-v8a) target=android-arm64 ;;
            x86_64) target=android-x64 ;;
          esac
          flutter build apk --release --split-per-abi --target-platform=$target
          cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
             "release/commuterlviv-${ver}-${abi}.apk"
        done

    - name: Verify signatures
      shell: bash
      working-directory: /tmp/build/nl.r1a.commuterlviv/mobile
      env:
        KEYSTORE_SHA256: 22e0d82c02f7a01805f121b40648bb4f6a2954b847e97089d3f73142ade31c32
      run: |
        signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | tail -1)
        for apk in release/*.apk; do
          "$signer" verify --print-certs "$apk" > verify.log
          grep -qi "$KEYSTORE_SHA256" verify.log || {
            echo "$apk is not signed by the expected key; aborting"
            cat verify.log
            exit 1
          }
        done
        ls -l release/

    - name: Restore the workspace path
      # The obsolete path has to exist again before any step runs from it:
      # the runner spawns every step with ${{ github.workspace }} as its
      # working directory unless the step says otherwise, and that failed
      # with "No such file or directory" on v0.9.3. This figure runs from
      # /tmp/build because the workspace is still gone at this point. An
      # empty dir is enough for the steps - the builds already ran in /tmp
      # and that is the path baked into the built APKs - but the runner
      # reads this action's own file again at the job's end, for the post
      # steps of the actions it uses, and failed the job without it
      shell: bash
      working-directory: /tmp/build/nl.r1a.commuterlviv
      run: |
        mkdir -p "$GITHUB_WORKSPACE/.github/actions"
        cp -r .github/actions/apks "$GITHUB_WORKSPACE/.github/actions/"
